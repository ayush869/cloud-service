# Reverse proxy in front of the API. TLS: terminate here (certbot) or on an AWS ALB.

upstream cloud_api {
    server api:3000;
    keepalive 64;
}

# Per-IP request rate for public file URLs (they are not rate limited inside the API).
limit_req_zone $binary_remote_addr zone=public_files:20m rate=100r/s;

server {
    listen 80;
    server_name _;

    # Must be >= MAX_UPLOAD_SIZE_BYTES.
    client_max_body_size 1100m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Stream uploads straight to the API instead of spooling them to nginx's disk first.
    proxy_request_buffering off;

    # File bytes. Only reachable through X-Accel-Redirect from the API, after it has
    # authorized the request - never directly from the internet.
    location /_protected/ {
        internal;
        alias /var/lib/cloud-storage/data/;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        # nginx keeps Content-Type / Content-Disposition / Cache-Control from the API
        # response; these security/CORS headers must be re-added explicitly.
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Access-Control-Allow-Origin $upstream_http_access_control_allow_origin always;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
        add_header X-Request-Id $upstream_http_x_request_id always;
    }

    # Permanent public URLs (website images).
    location /p/ {
        limit_req zone=public_files burst=300 nodelay;
        proxy_pass http://cloud_api;
    }

    location / {
        proxy_pass http://cloud_api;
    }
}
